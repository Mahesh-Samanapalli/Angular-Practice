<!-- Minimal scaffold mirroring the dashboard layout for practice -->
<div class="page">
  <mat-toolbar color="primary">
    <span>Practice: Insurance UI</span>
  </mat-toolbar>

  <div class="container">
    <div class="grid">
      <mat-card>
        <mat-card-title>Hero Area</mat-card-title>
        <mat-card-content>
          Replace this card with your design variations.
        </mat-card-content>
      </mat-card>

      <div class="kpi-grid">
        <mat-card><mat-card-content>Metric 1</mat-card-content></mat-card>
        <mat-card><mat-card-content>Metric 2</mat-card-content></mat-card>
        <mat-card><mat-card-content>Metric 3</mat-card-content></mat-card>
        <mat-card><mat-card-content>Metric 4</mat-card-content></mat-card>
      </div>
    </div>

    <div class="grid two">
      <mat-card>
        <mat-card-title>Form Area</mat-card-title>
        <mat-card-content>
          Build your form here (use Material form fields, selects, etc.).
        </mat-card-content>
      </mat-card>

      <mat-card>
        <mat-card-title>Table/List Area</mat-card-title>
        <mat-card-content>
          Build a table/list here (e.g., `mat-table`, `mat-list`).
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
